<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="rotation3DEffect는 회전 전 프레임을, rotation3DLayout은 회전한 뷰를 감싸는 바운딩 박스를 레이아웃에 보고한다는 비교도">
  <style>
    .panel { fill: #1b2431; stroke: #374151; stroke-width: 1.5; rx: 12; }
    .body { fill: #1e3a5f; stroke: #3b82f6; stroke-width: 1.5; }
    .ring { fill: none; stroke: #3b82f6; stroke-width: 1.5; }
    .card { fill: #3f2d1e; stroke: #b45309; stroke-width: 1.5; rx: 4; }
    .reserved { stroke: #10b981; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
    .head { font: 600 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #f9fafb; }
    .sub { font: 600 13px -apple-system, BlinkMacSystemFont, sans-serif; fill: #9ca3af; }
    .tag { font: 400 12px -apple-system, BlinkMacSystemFont, sans-serif; fill: #9ca3af; }
    .ok { font: 600 12px -apple-system, BlinkMacSystemFont, sans-serif; fill: #10b981; }
    .note { font: 400 13px -apple-system, BlinkMacSystemFont, sans-serif; fill: #9ca3af; }
  </style>
  <rect x="0" y="0" width="640" height="420" fill="#111827"/>

  <text class="sub" x="24" y="28">토성을 정면에서 본 모습 — 점선은 레이아웃이 비워 두는 자리</text>

  <rect class="panel" x="24" y="48" width="296" height="248"/>
  <text class="head" x="40" y="74">.rotation3DEffect</text>
  <text class="tag" x="40" y="94">회전 전 프레임을 보고합니다</text>
  <rect class="reserved" x="51" y="146" width="158" height="68"/>
  <g transform="rotate(-26.7 130 180)">
    <ellipse class="ring" cx="130" cy="180" rx="79" ry="34"/>
    <circle class="body" cx="130" cy="180" r="34"/>
  </g>
  <rect class="card" x="221" y="120" width="80" height="120"/>
  <text class="tag" x="40" y="268">고리 끝이 점선 밖으로 나갑니다</text>

  <rect class="panel" x="328" y="48" width="296" height="248"/>
  <text class="head" x="344" y="74">.rotation3DLayout</text>
  <text class="tag" x="344" y="94">회전한 뷰를 감싸는 상자를 보고합니다</text>
  <rect class="reserved" x="344" y="114" width="172" height="132"/>
  <g transform="rotate(-26.7 430 180)">
    <ellipse class="ring" cx="430" cy="180" rx="79" ry="34"/>
    <circle class="body" cx="430" cy="180" r="34"/>
  </g>
  <rect class="card" x="528" y="120" width="80" height="120"/>
  <text class="ok" x="344" y="268">고리 끝까지 점선 안에 들어옵니다</text>

  <text class="note" x="24" y="330">토성 기준으로 예약 반폭이 0.662 m에서 0.719 m로 늘어, 설명 창이 5.7cm 더 밀려납니다.</text>
  <text class="note" x="24" y="352">두 경우 모두 겹치지는 않습니다. 겹침을 없애는 것은 visualBounds 실측이고,</text>
  <text class="note" x="24" y="374">기울기를 레이아웃에 보고하는 일은 그 위에 여유를 더하는 역할입니다.</text>
  <text class="note" x="24" y="404">주황색 사각형은 설명 창, 파란색은 확대된 행성입니다.</text>
</svg>
