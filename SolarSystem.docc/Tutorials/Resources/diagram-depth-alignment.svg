<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="depthAlignment의 front, center, back이 깊이가 다른 두 자식을 각각 어떤 면에 맞추는지 보여 주는 비교도">
  <style>
    .panel { fill: #1b2431; stroke: #374151; stroke-width: 1.5; rx: 12; }
    .box { fill: #1e3a5f; stroke: #3b82f6; stroke-width: 1.5; }
    .plate { fill: #3f2d1e; stroke: #b45309; stroke-width: 1.5; }
    .guide { stroke: #10b981; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
    .axis { stroke: #6b7280; stroke-width: 1.5; fill: none; }
    .head { font: 600 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #f9fafb; }
    .sub { font: 600 13px -apple-system, BlinkMacSystemFont, sans-serif; fill: #9ca3af; }
    .tag { font: 400 12px -apple-system, BlinkMacSystemFont, sans-serif; fill: #9ca3af; }
    .note { font: 400 13px -apple-system, BlinkMacSystemFont, sans-serif; fill: #9ca3af; }
  </style>
  <rect x="0" y="0" width="640" height="400" fill="#111827"/>

  <text class="sub" x="24" y="28">HStackLayout의 자식 두 개를 위에서 내려다본 모습</text>
  <path class="axis" d="M 24 44 L 114 44"/>
  <path class="axis" d="M 106 39 L 114 44 L 106 49"/>
  <text class="tag" x="122" y="48">z — 보는 사람 쪽</text>

  <rect class="panel" x="24" y="62" width="190" height="200"/>
  <text class="head" x="40" y="88">.front</text>
  <text class="tag" x="40" y="108">보는 사람 쪽 면을 맞춥니다</text>
  <rect class="box" x="68" y="130" width="100" height="42"/>
  <rect class="plate" x="152" y="192" width="16" height="42"/>
  <path class="guide" d="M 168 122 L 168 246"/>

  <rect class="panel" x="226" y="62" width="190" height="200"/>
  <text class="head" x="242" y="88">.center</text>
  <text class="tag" x="242" y="108">깊이 중심을 맞춥니다</text>
  <rect class="box" x="254" y="130" width="100" height="42"/>
  <rect class="plate" x="296" y="192" width="16" height="42"/>
  <path class="guide" d="M 304 122 L 304 246"/>

  <rect class="panel" x="428" y="62" width="190" height="200"/>
  <text class="head" x="444" y="88">.back</text>
  <text class="tag" x="444" y="108">먼 쪽 면을 맞춥니다</text>
  <rect class="box" x="456" y="130" width="100" height="42"/>
  <rect class="plate" x="456" y="192" width="16" height="42"/>
  <path class="guide" d="M 456 122 L 456 246"/>

  <rect class="box" x="24" y="284" width="26" height="14"/>
  <text class="tag" x="60" y="296">깊이가 있는 자식 — 확대된 행성</text>
  <rect class="plate" x="24" y="310" width="26" height="14"/>
  <text class="tag" x="60" y="322">거의 평면인 자식 — 설명 창</text>

  <text class="note" x="24" y="356">두 자식의 깊이가 다를 때만 .front와 .center가 서로 다른 자리에 놓입니다.</text>
  <text class="note" x="24" y="378">창 UI처럼 자식이 모두 평면이면 어떤 값을 줘도 화면은 같습니다.</text>
</svg>
