<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="압축을 푼 시작 프로젝트의 폴더 구조와 WorldAssets를 넣을 자리">
  <style>
    .card { fill: #1b2431; stroke: #374151; stroke-width: 1.5; rx: 12; }
    .row { font: 400 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #d1d5db; }
    .dim { font: 400 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #6b7280; }
    .here { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #f59e0b; }
    .slot { fill: none; stroke: #f59e0b; stroke-width: 1.5; stroke-dasharray: 5 4; rx: 6; }
    .head { font: 600 14px -apple-system, BlinkMacSystemFont, sans-serif; fill: #f9fafb; }
    .note { font: 400 13px -apple-system, BlinkMacSystemFont, sans-serif; fill: #9ca3af; }
    .title { font: 600 14px -apple-system, BlinkMacSystemFont, sans-serif; fill: #6b7280; }
  </style>
  <rect x="0" y="0" width="640" height="400" fill="#111827"/>

  <text class="title" x="24" y="30">압축을 푼 뒤의 폴더 구조</text>

  <rect class="card" x="24" y="48" width="592" height="268"/>
  <text class="head" x="44" y="76">SolarSystem-StartingProject/</text>

  <text class="row" x="60" y="104">SolarSystem.xcodeproj</text>
  <text class="dim" x="300" y="104">← 이 파일을 엽니다</text>

  <text class="row" x="60" y="130">SolarSystem/</text>
  <text class="dim" x="300" y="130">← 코드와 리소스가 전부 들어 있음</text>
  <text class="dim" x="84" y="152">Entities/  Model/  RealityViews/  Scenes/  Systems/  Resources/</text>

  <text class="row" x="60" y="182">Packages/</text>
  <text class="row" x="84" y="206">RealityKitContent/</text>
  <text class="dim" x="300" y="206">← 들어 있음</text>

  <rect class="slot" x="78" y="220" width="200" height="26"/>
  <text class="here" x="90" y="238">WorldAssets/</text>
  <text class="here" x="300" y="238">← 여기에 넣습니다</text>
  <text class="dim" x="108" y="264">Package.swift</text>

  <text class="row" x="60" y="294">README.txt</text>

  <text class="note" x="24" y="350">에셋 zip에서 꺼낸 WorldAssets 폴더를 통째로 Packages 안에 넣으면 됩니다.</text>
  <text class="note" x="24" y="374">Add Local로 다시 연결할 필요는 없습니다. 프로젝트가 이 경로를 이미 참조합니다.</text>
</svg>
