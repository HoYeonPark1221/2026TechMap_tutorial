<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="프로젝트의 다섯 폴더가 무엇을 담는지와 튜토리얼에서 직접 쓰는 자리">
  <style>
    .card { fill: #1b2431; stroke: #374151; stroke-width: 1.5; rx: 10; }
    .fill { fill: #3f2d1e; stroke: #b45309; stroke-width: 1.5; rx: 10; }
    .name { font: 600 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #f9fafb; }
    .role { font: 400 12px -apple-system, BlinkMacSystemFont, sans-serif; fill: #9ca3af; }
    .mark { font: 600 11px -apple-system, BlinkMacSystemFont, sans-serif; fill: #f59e0b; }
    .note { font: 400 13px -apple-system, BlinkMacSystemFont, sans-serif; fill: #9ca3af; }
    .title { font: 600 14px -apple-system, BlinkMacSystemFont, sans-serif; fill: #6b7280; }
  </style>
  <rect x="0" y="0" width="640" height="400" fill="#111827"/>

  <text class="title" x="24" y="30">SolarSystem/ 안의 폴더 구성</text>

  <rect class="card" x="24" y="48" width="290" height="62"/>
  <text class="name" x="44" y="72">Entities/</text>
  <text class="role" x="44" y="92">공전·자전·축 기울기를 담은 RealityKit 엔티티</text>

  <rect class="card" x="326" y="48" width="290" height="62"/>
  <text class="name" x="346" y="72">Systems/</text>
  <text class="role" x="346" y="92">매 프레임 도는 코드 — 회전, 궤적</text>

  <rect class="card" x="24" y="122" width="290" height="62"/>
  <text class="name" x="44" y="146">RealityViews/</text>
  <text class="role" x="44" y="166">엔티티를 화면에 올리는 뷰</text>
  <text class="mark" x="44" y="180">PlanetFocusLayout의 body — 2챕터</text>

  <rect class="fill" x="326" y="122" width="290" height="62"/>
  <text class="name" x="346" y="146">Scenes/</text>
  <text class="role" x="346" y="166">창과 몰입 공간</text>
  <text class="mark" x="346" y="180">새 파일 둘 — 2챕터 · 버튼과 생명주기 — 3챕터</text>

  <rect class="card" x="24" y="196" width="290" height="62"/>
  <text class="name" x="44" y="220">Model/</text>
  <text class="role" x="44" y="240">앱 상태와 문구</text>
  <text class="mark" x="44" y="254">AppModel의 몰입 공간 상태 — 3챕터</text>

  <rect class="card" x="326" y="196" width="290" height="62"/>
  <text class="name" x="346" y="220">Resources/</text>
  <text class="role" x="346" y="240">이미지 에셋과 조명용 스카이박스</text>
  <text class="mark" x="346" y="254">그대로 두면 됩니다</text>

  <rect class="fill" x="24" y="270" width="592" height="46"/>
  <text class="name" x="44" y="294">SolarSystemApp.swift</text>
  <text class="mark" x="300" y="294">창과 몰입 공간 Scene — 3챕터</text>

  <text class="note" x="24" y="348">주황색이 직접 쓰는 자리입니다. 자리마다 몇 챕터인지 주석으로 적어 두었습니다.</text>
  <text class="note" x="24" y="374">동기화 폴더를 쓰므로, 새 파일은 폴더에 넣기만 하면 Xcode가 잡습니다.</text>
</svg>
